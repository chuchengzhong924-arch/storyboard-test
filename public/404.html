<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在打开页面…</title>
    <script>
      (function () {
        var base = '/storyboard-test/';
        var path = window.location.pathname;
        var route = path.indexOf(base) === 0 ? path.slice(base.length - 1) : '/';
        var next = base + '?route=' + encodeURIComponent(route + window.location.search + window.location.hash);
        window.location.replace(next);
      })();
    </script>
  </head>
  <body>正在打开页面…</body>
</html>
